buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = rootProject.file('gradletools.gradle')
if (sharedTools.isFile()) {
    apply from: sharedTools
} else if (file('../Multi_neo/gradletools.gradle').isFile()) {
    apply from: '../Multi_neo/gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.2_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "xnet"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repos()
at()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    mc()
    jei()
    top()
    mcjtylib()
    rftoolsbase()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'rftools-base'], ['the-one-probe'], ['mcjtylib', 'rftools-base'], [])

tasks.named('test') { useJUnitPlatform() }
