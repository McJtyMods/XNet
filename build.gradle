buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Share build tools with Multi_neo in standalone and workspace builds.
def sharedTools = [rootProject.file('gradletools.gradle'),
                   file('../Multi_neo/gradletools.gradle'),
                   file('../gradletools.gradle')].find { it.isFile() }
if (sharedTools != null) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "xnet"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repos()
at()
runs()
extensions.getByName('runs').named('gameTestServer') {
    modSource sourceSets.gametest
    arguments.addAll '--test', 'xnet:*'
}
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    mc()
    jei()
    top()
    mcjtylib()
    rftoolsbase()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'rftools-base'], ['the-one-probe'], ['mcjtylib', 'rftools-base'], [])

tasks.named('test') { useJUnitPlatform() }
