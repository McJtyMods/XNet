buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.2_fabric/gradletools.gradle'

group = "com.github.mcjty"
base.archivesName = "xnet-fabric"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repos()
access()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    mc()
    config()
    energy()
    jei()
    top()
    mcjtylib()
    rftoolsbase()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'rftools-base', 'fabric-api', 'forge-config-api-port'], ['the-one-probe'], ['mcjtylib', 'rftools-base', 'fabric-api', 'forge-config-api-port'], [])

tasks.named('test') { useJUnitPlatform() }

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
